services:
  db:
    image: postgres:16-alpine
    container_name: elprof-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: elprof
      POSTGRES_USER: elprof_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - elprof-db-data:/var/lib/postgresql/data
      - ./db-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elprof_user -d elprof"]
      interval: 10s
      timeout: 5s
      retries: 5

  elprof:
    build: .
    container_name: elprof-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_VERSION: 3.9.0
      PORT: 3000
      DATABASE_URL: postgresql://elprof_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/elprof
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DB_SSL: "false"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://www.elprof.online}
      LIVE_CLASS_PROVIDER: ${LIVE_CLASS_PROVIDER:-jitsi}
      JITSI_BASE_URL: ${JITSI_BASE_URL:-https://meet.jit.si}
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$(hostname):3000/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  elprof-db-data:
