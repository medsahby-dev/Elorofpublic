<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL PROF — Admin</title><link rel="stylesheet" href="/style.css"></head><body><header class="top darktop"><a class="brand" href="/admin.html">EL PROF ADMIN</a><nav><a href="/dashboard.html">Espace élève</a><button onclick="logout()">Déconnexion</button></nav></header><main class="app"><div class="welcome"><div><span class="eyebrow">ADMINISTRATION</span><h1>Vue d’ensemble</h1></div></div><section class="stats"><article><b>👨‍🎓</b><strong id="students">0</strong><small>Élèves</small></article><article><b>📚</b><strong id="courses">0</strong><small>Cours</small></article><article><b>🧠</b><strong id="quizzes">0</strong><small>Quiz</small></article></section><section class="panel"><h2>Utilisateurs récents</h2><div id="users"></div></section></main><script>const t=localStorage.getItem('elprof_token');if(!t)location='/connexion.html';const h={Authorization:'Bearer '+t};function logout(){localStorage.clear();location='/connexion.html'}Promise.all([fetch('/api/admin/stats',{headers:h}).then(r=>r.json()),fetch('/api/admin/users',{headers:h}).then(r=>r.json())]).then(([s,u])=>{if(!s.success)return logout();students.textContent=s.students;courses.textContent=s.courses;quizzes.textContent=s.quizzes;users.innerHTML=u.users.slice(0,10).map(x=>`<p><b>${x.first_name} ${x.last_name}</b> · ${x.email} · ${x.level}</p>`).join('')})</script></body></html>
