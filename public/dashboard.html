<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL PROF — Dashboard</title><link rel="stylesheet" href="/style.css"></head><body><header class="top darktop"><a class="brand" href="/dashboard.html">EL PROF</a><nav><a href="/cours.html">Cours</a><a href="/exercices.html">Exercices</a><a href="/quiz.html">Quiz</a><a href="/profil.html">Profil</a><button onclick="logout()">Déconnexion</button></nav></header><main class="app"><div class="welcome"><div><span class="eyebrow">TON ESPACE ÉLÈVE</span><h1>Bonjour <span id="name">…</span> 👋</h1><p>Continue ton parcours et garde le rythme.</p></div><span class="pill" id="level">Débutant</span></div><section class="stats"><article><b>⭐</b><strong id="xp">0</strong><small>XP accumulé</small></article><article><b>📚</b><strong id="courses">0</strong><small>Cours disponibles</small></article><article><b>🎯</b><strong id="objective">—</strong><small>Objectif</small></article></section><section class="panel"><div class="panel-title"><h2>Recommandé pour toi</h2><a href="/cours.html">Voir tout →</a></div><div id="courseList" class="grid"></div></section></main><script>const t=localStorage.getItem('elprof_token');if(!t)location='/connexion.html';const H={Authorization:'Bearer '+t};function logout(){localStorage.clear();location='/connexion.html'}Promise.all([fetch('/api/me',{headers:H}).then(r=>r.json()),fetch('/api/courses',{headers:H}).then(r=>r.json())]).then(([u,c])=>{if(!u.success)return logout();name.textContent=u.user.firstName;level.textContent='Niveau : '+u.user.level;xp.textContent=u.user.xp;objective.textContent=u.user.objective;courses.textContent=c.courses.length;courseList.innerHTML=c.courses.slice(0,3).map(x=>`<a class="course" href="/cours-detail.html?id=${x.id}"><span>${x.icon}</span><h3>${x.title}</h3><p>${x.description}</p><small>${x.level} · ${x.lesson_count||0} leçons</small></a>`).join('')})</script></body></html>
