<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL PROF — Cours</title><link rel="stylesheet" href="/style.css"></head><body><header class="top darktop"><a class="brand" href="/dashboard.html">EL PROF</a><nav><a href="/cours.html">Tous les cours</a><a href="/dashboard.html">Dashboard</a></nav></header><main class="app"><div id="course" class="panel">Chargement…</div></main><script>const t=localStorage.getItem('elprof_token'),id=new URLSearchParams(location.search).get('id');if(!t)location='/connexion.html';fetch('/api/courses/'+id,{headers:{Authorization:'Bearer '+t}}).then(r=>r.json()).then(j=>{const c=j.course;course.innerHTML=`<span class="eyebrow">${c.level}</span><h1>${c.icon} ${c.title}</h1><p>${c.description}</p><div class="lesson-list">${c.lessons.map(l=>`<article><div><b>Leçon ${l.lesson_number} · ${l.title}</b><p>${l.description}</p><small>${l.duration}</small></div><button class="btn yellow" onclick="done(${l.id},this)">Terminer</button></article>`).join('')}</div>`});async function done(id,b){await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({lessonId:id,completed:true})});b.textContent='✓ Terminée';b.disabled=true}</script></body></html>
