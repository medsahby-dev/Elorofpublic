<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL PROF — Profil</title><link rel="stylesheet" href="/style.css"></head><body><header class="top darktop"><a class="brand" href="/dashboard.html">EL PROF</a><nav><a href="/dashboard.html">Dashboard</a><button onclick="logout()">Déconnexion</button></nav></header><main class="app"><section class="panel"><span class="eyebrow">MON COMPTE</span><h1 id="name">…</h1><div id="details"></div></section></main><script>const t=localStorage.getItem('elprof_token');if(!t)location='/connexion.html';function logout(){localStorage.clear();location='/connexion.html'}fetch('/api/me',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json()).then(j=>{const u=j.user;name.textContent=u.firstName+' '+u.lastName;details.innerHTML=`<p>Email : ${u.email}</p><p>Niveau : ${u.level}</p><p>Objectif : ${u.objective}</p><p>Abonnement : ${u.subscription}</p><p>XP : ${u.xp}</p>`})</script></body></html>
