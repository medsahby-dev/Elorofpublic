<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL PROF — Activités</title><link rel="stylesheet" href="/style.css"></head><body><header class="top darktop"><a class="brand" href="/dashboard.html">EL PROF</a><nav><a href="/cours.html">Cours</a><a href="/quiz.html">Quiz</a><a href="/dashboard.html">Dashboard</a></nav></header><main class="app"><div class="welcome"><div><span class="eyebrow">ENTRAÎNEMENT</span><h1>Exercices</h1></div></div><div id="list" class="grid"></div></main><script>const t=localStorage.getItem('elprof_token');if(!t)location='/connexion.html';fetch('/api/exercises',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json()).then(j=>list.innerHTML=j.exercises.map(x=>`<article class="course"><span>🎯</span><h3>${x.title}</h3><p>${x.question}</p><small>+${x.xp} XP</small></article>`).join(''))</script></body></html>
