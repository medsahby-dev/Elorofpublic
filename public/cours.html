<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL PROF — Cours</title><link rel="stylesheet" href="/style.css"></head><body><header class="top darktop"><a class="brand" href="/dashboard.html">EL PROF</a><nav><a href="/dashboard.html">Dashboard</a><a href="/exercices.html">Exercices</a><a href="/quiz.html">Quiz</a></nav></header><main class="app"><div class="welcome"><div><span class="eyebrow">APPRENTISSAGE</span><h1>Mes cours</h1><p>Choisis un cours et avance leçon après leçon.</p></div></div><div id="list" class="grid"></div></main><script>const t=localStorage.getItem('elprof_token');if(!t)location='/connexion.html';fetch('/api/courses',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json()).then(j=>list.innerHTML=j.courses.map(x=>`<a class="course" href="/cours-detail.html?id=${x.id}"><span>${x.icon}</span><h3>${x.title}</h3><p>${x.description}</p><small>${x.level} · ${x.duration} · ${x.lesson_count||0} leçons</small></a>`).join(''))</script></body></html>
