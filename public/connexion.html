<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL PROF — Connexion</title><link rel="stylesheet" href="/style.css"></head><body><main class="auth"><form id="form" class="auth-card"><a class="brand" href="/">EL PROF</a><h1>Bienvenue</h1><p>Retrouve ton espace d’apprentissage.</p><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Mot de passe" required><button class="btn yellow" type="submit">Se connecter</button><small id="msg"></small><p>Pas encore de compte ? <a href="/inscription.html">S’inscrire</a></p></form></main><script>form.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))}),j=await r.json();if(!j.success)return msg.textContent=j.message;localStorage.setItem('elprof_token',j.token);location=j.user.role==='admin'?'/admin.html':'/dashboard.html'}</script></body></html>
