<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription | EL PROF</title>
  <meta name="description" content="Crée ton compte EL PROF et commence ton parcours de français.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .auth-provider-icon {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      display: block;
    }

    .auth-alt .button-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="EL PROF - Accueil">
        <img src="/logo.png" alt="Logo EL PROF" class="brand-logo">
        <span>EL <strong>PROF</strong></span>
      </a>

      <nav class="main-nav" aria-label="Navigation principale">
        <a href="/#cours">Cours</a>
        <a href="/#niveaux">Niveaux</a>
        <a href="/#offres">Offres</a>
        <a href="/#temoignages">Avis</a>
        <a href="/connexion.html">Connexion</a>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu" aria-expanded="false">☰</button>
    </div>

    <nav class="mobile-nav" id="mobileNav">
      <a href="/#cours">Cours</a>
      <a href="/#niveaux">Niveaux</a>
      <a href="/#offres">Offres</a>
      <a href="/#temoignages">Avis</a>
      <a href="/connexion.html">Connexion</a>
    </nav>
  </header>

  <main class="auth-shell">
    <div class="auth-box">
      <div class="auth-top">
        <img src="/logo.png" alt="Logo EL PROF" class="auth-logo">
        <span class="auth-badge">Inscription</span>
        <h1>Crée ton compte</h1>
        <p>Rejoins EL PROF et commence ton parcours de français.</p>
      </div>

      <form class="auth-form" action="/dashboard.html" method="get">
        <div class="field">
          <label for="fullName">Nom complet</label>
          <input id="fullName" name="fullName" type="text" placeholder="Votre nom complet" required>
        </div>

        <div class="field">
          <label for="studentLevel">Niveau scolaire</label>
          <select id="studentLevel" name="studentLevel">
            <option>7ème</option>
            <option>8ème</option>
            <option>9ème</option>
            <option>1ère</option>
            <option>2ème</option>
            <option>3ème</option>
            <option>Bac</option>
          </select>
        </div>

        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input id="email" name="email" type="email" placeholder="exemple@email.com" required>
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" placeholder="********" required>
        </div>

        <div class="field">
          <label for="passwordConfirm">Confirmer le mot de passe</label>
          <input id="passwordConfirm" name="passwordConfirm" type="password" placeholder="********" required>
        </div>

        <div class="inline-row">
          <label class="checkbox">
            <input type="checkbox" required>
            <span>J'accepte les conditions</span>
          </label>
        </div>

        <div class="auth-actions">
          <button class="button button-yellow full" type="submit">Créer mon compte</button>
        </div>
      </form>

      <div class="auth-divider"><span>ou</span></div>

      <div class="auth-alt">
        <button class="button-secondary" type="button" aria-label="S’inscrire avec Google">
          <svg class="auth-provider-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="#4285F4" d="M21.35 12.23c0-.72-.06-1.42-.18-2.09H12v3.96h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.26Z"/>
            <path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.5Z"/>
            <path fill="#FBBC05" d="M6.54 13.58A5.86 5.86 0 0 1 6.23 12c0-.55.11-1.08.31-1.58V7.89H3.3A9.48 9.48 0 0 0 2.25 12c0 1.48.35 2.88 1.05 4.11l3.24-2.53Z"/>
            <path fill="#EA4335" d="M12 6.39c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.48 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.7 5.39l3.24 2.53C7.31 8.11 9.46 6.39 12 6.39Z"/>
          </svg>
          <span>S’inscrire avec Google</span>
        </button>
        <button class="button-secondary" type="button" aria-label="S’inscrire avec Apple">
          <svg class="auth-provider-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M17.05 12.54c-.02-2.13 1.74-3.16 1.82-3.21a3.93 3.93 0 0 0-3.1-1.68c-1.3-.14-2.56.78-3.22.78-.67 0-1.7-.76-2.8-.74a4.13 4.13 0 0 0-3.48 2.12c-1.5 2.6-.38 6.45 1.06 8.56.7 1.03 1.54 2.17 2.64 2.13 1.06-.04 1.46-.69 2.75-.69 1.28 0 1.65.69 2.77.67 1.15-.02 1.87-1.04 2.55-2.08a8.5 8.5 0 0 0 1.16-2.4 3.72 3.72 0 0 1-2.15-3.46ZM14.94 6.27a3.7 3.7 0 0 0 .85-2.67 3.8 3.8 0 0 0-2.45 1.27 3.55 3.55 0 0 0-.87 2.57 3.14 3.14 0 0 0 2.47-1.17Z"/>
          </svg>
          <span>S’inscrire avec Apple</span>
        </button>
      </div>

      <div class="auth-footer">
        Déjà inscrit ? <a href="/connexion.html">Se connecter</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <a class="brand" href="/"><img src="/logo.png" alt="Logo EL PROF" class="footer-logo"><span>EL <strong>PROF</strong></span></a>
      <p>© 2026 EL PROF — Cours particuliers en français.</p>
      <div><a href="/connexion.html">Connexion</a> · <a href="/inscription.html">Inscription</a></div>
    </div>
  </footer>

  <script>
    const toggle = document.getElementById('menuToggle');
    const nav = document.getElementById('mobileNav');

    toggle.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', String(open));
    });

    nav.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => nav.classList.remove('open'));
    });
  </script>
</body>
</html>
