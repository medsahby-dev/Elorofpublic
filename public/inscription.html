<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL PROF — Inscription</title><link rel="stylesheet" href="/style.css"></head><body><main class="auth"><form id="form" class="auth-card"><a class="brand" href="/">EL PROF</a><h1>Créer ton compte</h1><p>Commence ton parcours personnalisé.</p><input name="firstName" placeholder="Prénom" required><input name="lastName" placeholder="Nom"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Mot de passe — 8 caractères minimum" required minlength="8"><button class="btn yellow" type="submit">Commencer</button><small id="msg"></small><p>Déjà inscrit ? <a href="/connexion.html">Se connecter</a></p></form></main><script>form.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))}),j=await r.json();if(!j.success)return msg.textContent=j.message;localStorage.setItem('elprof_token',j.token);location='/dashboard.html'}</script></body></html>
